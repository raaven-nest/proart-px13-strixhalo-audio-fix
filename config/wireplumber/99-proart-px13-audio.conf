# ============================================================================
#  ASUS ProArt PX13 (HN7306) - AMD Ryzen AI Max+ 395 "Strix Halo"
#  WirePlumber drop-in: make the built-in audio usable
# ============================================================================
#
# Problem
# -------
# The laptop's speakers/mics/headphone-jack hang off an AMD ACP7.0 SoundWire
# bus (Realtek RT721 headset codec + 2x TI TAS2783 "SmartAmp" for the
# speakers). On current kernels the machine driver `snd_acp_sdw_legacy_mach`
# cannot bring up the TAS2783 IV-sense CAPTURE link:
#
#   soundwire sdw-master-0-1: Program params failed: -22
#   SDW1-PIN4-CAPTURE-SmartAmp: ASoC error (-22): at snd_soc_link_prepare()
#
# Because that endpoint fails, PipeWire marks the normal card profile
# "unavailable" and falls back to a Dummy Output -> no sound at all.
#
# What this file does
# -------------------
#   1. Pins the card to the "pro-audio" profile, which exposes the working
#      playback/capture PCMs directly and skips the broken link.
#   2. Gives the raw nodes human-readable names.
#   3. Bumps the speaker node priority so it is picked as the default output
#      (there is no jack-detection auto-switching in pro-audio mode - pick
#      "Headphones" manually when you plug headphones in).
#   4. Disables the dead IV-sense capture PCM, which otherwise spams
#      "ASoC error (-22)" into the kernel log forever.
#
# Speaker over-drive protection is handled separately by the systemd user
# unit `tas2783-amp-cap.service` in this repo (the amp has no working DSP
# limiter here, so its analog gain is capped).
#
# Matching is done with regexes (the "~" prefix) so it does not depend on
# the exact PCI address. If your unit enumerates the capture PCMs in a
# different order, adjust the "pro-input-N" numbers (see diagnose.sh).
# ============================================================================

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*platform-amd_sdw" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output\\..*amd_sdw\\.pro-output-2" }
    ]
    actions = {
      update-props = {
        node.description = "Speakers"
        node.nick        = "Speakers"
        priority.session = 1010
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output\\..*amd_sdw\\.pro-output-0" }
    ]
    actions = {
      update-props = {
        node.description = "Headphones"
        node.nick        = "Headphones"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\\..*amd_sdw\\.pro-input-1" }
    ]
    actions = {
      update-props = {
        node.description = "Headset Microphone (jack)"
        node.nick        = "Headset Mic"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\\..*amd_sdw\\.pro-input-4" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Microphone"
        node.nick        = "Built-in Mic"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\\..*amd_sdw\\.pro-input-3" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
